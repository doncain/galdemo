(()=>{"use strict";var e={611(e,n,t){var r=t(601),a=t.n(r),l=t(314),o=t.n(l)()(a());o.push([e.id,"// minigal · index.css（S1 播放层）\n// 朴素够用：无图、无立绘，纯文字 + 氛围色。美化随意，丑不影响验收。\n\n/* 高度链路必须一路撑满，缺一环 .gal-root 的 align-items:flex-end 就会失效，\n   表现为「文本框飘到顶部」——这是纯 CSS 的静默失效，不报错。 */\nhtml,\nbody {\n  margin: 0;\n  padding: 0;\n  height: 100%;\n}\n\n#root {\n  height: 100%;\n}\n\n.gal-app {\n  width: 100%;\n  height: 100%;\n  position: relative;\n}\n\n.gal-root {\n  width: 100%;\n  height: 100%;\n  position: relative;\n  overflow: hidden;\n  background: radial-gradient(circle at 50% 18%, #1b1f2b 0%, #0d0f16 62%);\n  color: #f2ede2;\n  user-select: none;\n  cursor: pointer;\n  font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;\n  display: flex;\n  align-items: flex-end;\n}\n\n/* 顶部信息条要压在文本框之上，否则会被 .gal-textbox 盖住。\n   加半透明底衬：只有描边时，浅灰标签压在亮背景（天空/雪地）上几乎看不见 ——\n   截图核对时才发现它是「渲染了但读不出」。\n\n   ★ z-index 是必须的，不能靠 DOM 顺序。\n   这个标签是 .gal-app 的**第一个子元素**，而背景层是 z-index:0 的定位元素 ——\n   两者同属「z-index: 0/auto 的定位后代」这一层，按**树序**绘制，\n   于是背景把它整个盖住。症状极具欺骗性：位置、尺寸、文本全对\n   （布局断言也全绿），就是画不出来。人眼看截图才发现。\n   （旁边的 .gal-place 可见纯属侥幸 —— 它在 PlayScreen 里，树序靠后。\n     所以两个都显式给层级，别让可见性依赖元素摆放顺序。） */\n.gal-floor-tag {\n  position: absolute;\n  top: 18px;\n  left: 24px;\n  z-index: 30;\n  padding: 4px 12px;\n  font-size: 12px;\n  letter-spacing: 1.5px;\n  color: #b6b0a4;\n  background: rgba(10, 12, 18, 0.7);\n  border: 1px solid rgba(139, 133, 120, 0.35);\n  border-radius: 4px;\n}\n\n.gal-place {\n  position: absolute;\n  top: 18px;\n  right: 24px;\n  z-index: 30;\n  padding: 4px 12px;\n  font-size: 12px;\n  letter-spacing: 1.5px;\n  color: #a8c8e8;\n  background: rgba(10, 12, 18, 0.7);\n  border: 1px solid rgba(168, 200, 232, 0.3);\n  border-radius: 4px;\n}\n\n.gal-textbox {\n  position: relative;\n  z-index: 10;\n  margin: 0 auto 4vh;\n  width: min(880px, 92vw);\n  min-height: 22vh;\n  padding: 18px 24px 14px;\n  box-sizing: border-box;\n  background: rgba(10, 12, 18, 0.82);\n  border: 1px solid rgba(212, 183, 90, 0.35);\n  border-radius: 6px;\n}\n\n.gal-name {\n  position: absolute;\n  top: -16px;\n  left: 18px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 4px 14px;\n  background: #2b2f3d;\n  border: 1px solid rgba(212, 183, 90, 0.55);\n  border-radius: 4px;\n  font-size: 14px;\n  letter-spacing: 2px;\n  color: #f5d879;\n}\n\n.gal-name-user {\n  color: #9fd8ff;\n  border-color: rgba(120, 190, 255, 0.5);\n}\n\n/* 情绪标签：解析器早就在产出这个数据，S1 之前它一直困在数据里没有落点。\n   做成独立的窄胶囊，与角色名同排但视觉上分得开 —— 角色是「谁」，情绪是「什么状态」。 */\n.gal-emotion {\n  padding: 1px 8px;\n  border-radius: 10px;\n  font-size: 11px;\n  letter-spacing: 1px;\n  color: #d8b45a;\n  background: rgba(212, 183, 90, 0.14);\n  border: 1px solid rgba(212, 183, 90, 0.42);\n  white-space: nowrap;\n}\n\n/* 默认情绪（AI 没写方括号）弱化：虚线框 + 更低的对比度，\n   一眼能分出「作者明确标注了」和「系统兜了个默认值」。 */\n.gal-emotion-default {\n  color: #8b8578;\n  background: transparent;\n  border-style: dashed;\n  border-color: rgba(139, 133, 120, 0.55);\n}\n\n.gal-emotion-thought {\n  border-radius: 4px;\n  font-style: italic;\n}\n\n.gal-name-user .gal-emotion {\n  color: #9fd8ff;\n  background: rgba(120, 190, 255, 0.12);\n  border-color: rgba(120, 190, 255, 0.4);\n}\n\n.gal-name-user .gal-emotion-default {\n  color: #7b8fa0;\n  background: transparent;\n  border-style: dashed;\n  border-color: rgba(123, 143, 160, 0.55);\n}\n\n/* 旁白越界横幅：旁白应当是纯客观描写。AI 把台词写进旁白时不再静默放过。 */\n.gal-narrator-warn {\n  margin-bottom: 8px;\n  padding: 5px 10px;\n  font-size: 12px;\n  line-height: 1.5;\n  letter-spacing: 0.4px;\n  color: #e8a86a;\n  background: rgba(232, 168, 106, 0.1);\n  border-left: 2px solid rgba(232, 168, 106, 0.6);\n  border-radius: 2px;\n}\n\n.gal-text-suspect {\n  color: #e0b98d;\n}\n\n.gal-text {\n  min-height: 12vh;\n  font-size: 19px;\n  line-height: 1.9;\n  letter-spacing: 0.06em;\n  white-space: pre-wrap;\n}\n\n.gal-text.thought {\n  color: #e8c98a;\n  font-style: italic;\n}\n\n.gal-text.narrator {\n  color: #cfc9bc;\n}\n\n.gal-cursor {\n  display: inline-block;\n  margin-left: 4px;\n  animation: gal-blink 1s step-end infinite;\n}\n\n@keyframes gal-blink {\n  50% {\n    opacity: 0;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .gal-cursor {\n    animation: none;\n  }\n}\n\n.gal-foot {\n  margin-top: 8px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 12px;\n  color: #7d7a72;\n}\n\n.gal-options {\n  margin-top: 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.gal-option {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  padding: 10px 14px;\n  box-sizing: border-box;\n  background: rgba(43, 47, 61, 0.72);\n  border: 1px solid rgba(212, 183, 90, 0.3);\n  border-radius: 6px;\n  color: #f2ede2;\n  font-family: inherit;\n  font-size: 15px;\n  letter-spacing: 0.04em;\n  text-align: left;\n  cursor: pointer;\n  transition: border-color 0.15s, background 0.15s;\n}\n\n.gal-option:hover {\n  background: rgba(58, 63, 80, 0.9);\n  border-color: rgba(212, 183, 90, 0.7);\n}\n\n.gal-option-key {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 20px;\n  height: 20px;\n  flex: 0 0 20px;\n  border-radius: 50%;\n  font-size: 12px;\n  color: #f5d879;\n  border: 1px solid rgba(212, 183, 90, 0.5);\n}\n\n.gal-hint {\n  letter-spacing: 0.5px;\n}\n\n.gal-confidence {\n  letter-spacing: 0.5px;\n  color: #8a7f66;\n}\n\n.gal-empty {\n  margin: auto;\n  padding: 40px;\n  color: #999;\n  text-align: center;\n  line-height: 2;\n}\n\n/* ── 开发条：仅本地裸跑可见的价值在「看清解析结果」，接入酒馆后整块删除 ── */\n.gal-app {\n  width: 100%;\n  height: 100%;\n  position: relative;\n}\n\n.gal-devbar {\n  position: absolute;\n  bottom: 0;\n  left: 0;\n  right: 0;\n  z-index: 40;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 8px 16px;\n  font-family: ui-monospace, Menlo, Consolas, monospace;\n  font-size: 12px;\n  color: #8b8578;\n  background: rgba(8, 9, 13, 0.92);\n  border-top: 1px solid rgba(139, 133, 120, 0.2);\n}\n\n.gal-devbtn {\n  padding: 4px 12px;\n  font-family: inherit;\n  font-size: 12px;\n  color: #cfc9bc;\n  background: rgba(43, 47, 61, 0.8);\n  border: 1px solid rgba(139, 133, 120, 0.35);\n  border-radius: 4px;\n  cursor: pointer;\n}\n\n.gal-devbtn:hover {\n  border-color: rgba(212, 183, 90, 0.6);\n  color: #f5d879;\n}\n\n/* ═══════════════════════════════════════════════════════════════\n   S3 演出层：背景 CG + 三槽位立绘舞台\n   ═══════════════════════════════════════════════════════════════\n\n   层级令牌（与 PlayScreen 注释一一对应，改这里必须同步改那里）：\n     z-0   背景图\n     z-5   立绘舞台\n     z-10  文本框\n     z-30  场景标签\n     z-40  开发条\n\n   为什么立绘是 z-5 而不是 z-20（夹在背景和文本框之间）：\n     立绘的头部要能被文本框压住一点，这是 galgame 的通行构图——\n     人站在画面下半部，文本框叠在腰/腿的位置。若立绘在文本框之上，\n     就会盖住台词，玩家读不到字。\n*/\n\n/* ── 背景层 ──\n   object-fit: cover 保证任意画幅下都铺满、不拉伸变形（背景图的常见要求）。\n   淡入动画挂在节点重建上：React 用 key={场景路径} 触发，同场景翻页不重放。 */\n.gal-bg {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  animation: gal-bgfade 0.6s ease both;\n}\n\n@keyframes gal-bgfade {\n  from { opacity: 0; transform: scale(1.015); }\n  to   { opacity: 1; transform: scale(1); }\n}\n\n/* 背景之上的压暗层：让白色台词在任何背景上都能读清。\n   没有它时，亮背景（白天/雪地）上的浅色文字会糊成一片。\n   用 .gal-root::before 而不是额外的 DOM 节点——纯装饰，不该占 DOM。 */\n.gal-root::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  pointer-events: none;\n  background:\n    linear-gradient(to bottom, rgba(8, 9, 13, 0.42) 0%, rgba(8, 9, 13, 0) 26%),\n    linear-gradient(to top, rgba(8, 9, 13, 0.78) 0%, rgba(8, 9, 13, 0.10) 46%, rgba(8, 9, 13, 0) 70%);\n}\n\n/* ── 立绘舞台 ── */\n.gal-stage {\n  position: absolute;\n  inset: 0;\n  z-index: 5;\n  /* 舞台整体不吃鼠标事件：点击要穿透到 .gal-root 上触发翻页。\n     立绘 img 也不单独开启 pointer-events —— S3 不做点立绘交互。 */\n  pointer-events: none;\n}\n\n.gal-sprite {\n  position: absolute;\n  bottom: 0;\n  height: 86%;\n  /* 宽度上限：立绘必须窄于画面 1/3，否则三个人必然叠在一起。\n     只看 data-position 属性的断言发现不了这个问题——属性全对，图却挤成一团，\n     得靠眼睛看截图。max-width 用 vw 而不是 % 是因为 % 算的是舞台宽度的比例，\n     而我们要限制的是「不超过画面三分之一」这个与角色数无关的物理量。 */\n  max-width: 30vw;\n  transition: filter 0.3s ease, opacity 0.3s ease, transform 0.3s ease;\n  will-change: opacity, filter;\n}\n\n.gal-sprite img {\n  height: 100%;\n  width: auto;\n  /* 与父级的 max-width 配合：父级限宽后图要跟着缩，不能溢出。\n     object-fit 保证是等比缩放而不是拉伸。 */\n  max-width: 100%;\n  object-fit: contain;\n  object-position: bottom;\n  /* 立绘底部与画面底边之间留一点点渐隐，避免切边的硬感 */\n  -webkit-user-drag: none;\n  user-select: none;\n}\n\n/* 槽位：中间居中，左右各留 3% 边距。\n   用 transform 做居中而不是 margin-left，是为了让 transition 能作用在同一个属性上。 */\n.gal-sprite.pos-center { left: 50%; transform: translateX(-50%); }\n.gal-sprite.pos-right  { right: 3%; }\n.gal-sprite.pos-left   { left: 3%; }\n\n/* 说话人：全亮，并微微上抬（他站出来了一点） */\n.gal-sprite.is-active {\n  filter: none;\n  opacity: 1;\n}\n\n/* 旁听者：压暗 + 轻微去色。\n   不用 opacity 压暗——opacity 会让角色变透明，看起来像幽灵；\n   brightness/grayscale 才是退到光线外的观感。\n   去色强度刻意压得很轻（0.25）：调到 0.42 时青梧（青）会变成一团中性灰，\n   在紫色背景上像没渲染出来。旁听者应当「暗下来」，不是「变成灰影」。 */\n.gal-sprite.is-idle {\n  filter: brightness(0.62) grayscale(0.25) blur(0.3px);\n  opacity: 1;\n}\n\n/* 暂退（旁白/玩家发言）：真正离场。\n   保留 DOM 是刻意的——这是位置记忆能生效的前提（见 stage.ts 注释）。 */\n.gal-sprite.is-hidden {\n  opacity: 0;\n  transform: translateX(-50%) scale(0.985);\n}\n\n/* 左右槽位的暂退不能套用 center 的 translateX(-50%)，否则会横向跳位 */\n.gal-sprite.pos-left.is-hidden,\n.gal-sprite.pos-right.is-hidden {\n  transform: scale(0.985);\n}\n\n/* ── 场景标签（z-30，在文本框之上）── */\n.gal-place-warn {\n  margin-left: 8px;\n  padding: 1px 7px;\n  font-size: 11px;\n  letter-spacing: 0.5px;\n  color: #e8a86a;\n  background: rgba(232, 168, 106, 0.14);\n  border: 1px solid rgba(232, 168, 106, 0.5);\n  border-radius: 3px;\n}\n\n/* ── 有立绘时文本框的可读性补强 ──\n   立绘会挡在文本框后面，浅色立绘 + 浅色文字容易糊。\n   文本框自身已有半透明底，这里再加一层更实的底，保证对比度。 */\n.gal-root.has-cast .gal-textbox {\n  background: rgba(10, 11, 16, 0.88);\n  backdrop-filter: blur(2px);\n}\n\n/* ── 小屏：立绘缩一点，避免三个人挤成一团 ── */\n@media (max-width: 640px) {\n  .gal-sprite { height: 76%; }\n  .gal-sprite.pos-left  { left: 0; }\n  .gal-sprite.pos-right { right: 0; }\n}\n\n/* ══════════════════════════════════════════════════════════════\n   API 探针面板（S2 交付物的应用内形态）\n   ══════════════════════════════════════════════════════════════\n   只在点击「探 API」后渲染，所以这一段样式在默认态完全用不到。\n   z-index 40：与开发条同级，压住背景/立绘/文本框。\n   面板是**只读诊断**，不该吃鼠标事件冒泡到 gal-root（否则点面板会翻页）。 */\n.gal-probe {\n  position: absolute;\n  left: 12px;\n  right: 12px;\n  top: 12px;\n  max-height: 82%;\n  overflow: auto;\n  z-index: 40;\n  padding: 12px 14px;\n  font-family: ui-monospace, Consolas, monospace;\n  font-size: 12px;\n  color: #e6e1d6;\n  background: rgba(10, 12, 18, 0.96);\n  border: 1px solid rgba(212, 183, 90, 0.45);\n  border-radius: 6px;\n  cursor: default;\n}\n\n.gal-probe-head {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding-bottom: 8px;\n  margin-bottom: 10px;\n  border-bottom: 1px solid rgba(212, 183, 90, 0.25);\n}\n.gal-probe-head strong { font-size: 13px; color: #d4b75a; }\n.gal-probe-head > span { color: #8b8578; }\n.gal-probe-head button {\n  margin-left: auto;\n  padding: 3px 10px;\n  font-size: 11px;\n  color: #cfc9bc;\n  background: rgba(40, 44, 56, 0.9);\n  border: 1px solid rgba(139, 133, 120, 0.5);\n  border-radius: 4px;\n  cursor: pointer;\n}\n\n/* 结论条：三种级别用左border颜色区分，一眼看出能不能开工 */\n.gal-probe-verdict {\n  padding: 8px 10px;\n  margin-bottom: 10px;\n  line-height: 1.6;\n  border-left: 3px solid;\n  border-radius: 3px;\n}\n.gal-probe-verdict.is-ok   { color: #b6e3b0; background: rgba(110, 190, 100, 0.10); border-color: #6ebe64; }\n.gal-probe-verdict.is-warn { color: #e8c98a; background: rgba(232, 168, 106, 0.12); border-color: #e8a86a; }\n.gal-probe-verdict.is-bad  { color: #f0a8a8; background: rgba(230, 110, 110, 0.12); border-color: #e66e6e; }\n\n.gal-probe-cols {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));\n  gap: 14px;\n}\n.gal-probe-colhead {\n  margin-bottom: 5px;\n  color: #a8c8e8;\n  letter-spacing: 1px;\n  border-bottom: 1px solid rgba(168, 200, 232, 0.2);\n  padding-bottom: 3px;\n}\n.gal-probe-row {\n  display: flex;\n  gap: 6px;\n  padding: 1px 0;\n  line-height: 1.5;\n}\n.gal-probe-mark { width: 12px; flex: none; }\n.gal-probe-row.is-ok   .gal-probe-mark { color: #6ebe64; }\n.gal-probe-row.is-miss .gal-probe-mark { color: #e66e6e; }\n.gal-probe-row.is-miss .gal-probe-label { color: #e0a0a0; }\n.gal-probe-label { flex: 1; word-break: break-all; }\n.gal-probe-type { flex: none; color: #6d6a62; }\n\n.gal-probe-foot {\n  margin-top: 12px;\n  padding-top: 8px;\n  color: #8b8578;\n  border-top: 1px solid rgba(212, 183, 90, 0.2);\n}\n\n/* ══════════════════════════════════════════════════════════════\n   S4：楼层导航条 + 输入栏 + 提示条\n   ══════════════════════════════════════════════════════════════ */\n\n/* 楼层条：顶部居中。左右两侧已有「解析来源」与「场景标签」，\n   居中放置才不打架。做成胶囊形，与游戏画面的圆角风格一致。 */\n.gal-floorbar {\n  position: absolute;\n  top: 12px;\n  left: 50%;\n  transform: translateX(-50%);\n  z-index: 35;\n  display: flex;\n  /* 允许换行 + 限宽：S5 加了「重roll 本楼 / 删本楼」之后按钮变多，\n     窄屏上一行放不下会直接溢出视口（布局验收抓到的）。 */\n  flex-wrap: wrap;\n  justify-content: center;\n  max-width: calc(100% - 32px);\n  gap: 10px;\n  align-items: center;\n  padding: 5px 14px;\n  font-size: 12px;\n  letter-spacing: 0.5px;\n  color: #cfc9bc;\n  background: rgba(10, 12, 18, 0.85);\n  border: 1px solid rgba(212, 183, 90, 0.3);\n  border-radius: 18px;\n  backdrop-filter: blur(3px);\n}\n.gal-floorbar button {\n  background: none;\n  border: none;\n  padding: 0;\n  font: inherit;\n  color: #f5d879;\n  cursor: pointer;\n}\n.gal-floorbar button:disabled { color: #5a564e; cursor: default; }\n.gal-floorbar button:not(:disabled):hover { text-decoration: underline; }\n\n.gal-gening { color: #9fd8ff; }\n/* 生成中的呼吸感：一眼看出「在等」而不是「卡住了」 */\n@keyframes gal-gening-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }\n.gal-gening { animation: gal-gening-pulse 1.2s ease-in-out infinite; }\n\n/* ── 底部堆叠容器 ──\n   ★ 一个只有看截图才会发现的坑：输入栏与开发条原本各自 absolute bottom:0，\n   于是开发条
